services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gamer-shop-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    environment:
      PHP_IDE_CONFIG: serverName=gamer-shop
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: gamer_shop_testing
      DB_USERNAME: gamer_shop
      DB_PASSWORD: gamer_shop
      PHP_CLI_SERVER_WORKERS: 4
      DELIVERY_CONCURRENCY_TEST_DELAY_MS: 2000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload

  postgres:
    image: postgres:17-alpine
    container_name: gamer-shop-postgres
    environment:
      POSTGRES_DB: gamer_shop
      POSTGRES_USER: gamer_shop
      POSTGRES_PASSWORD: gamer_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamer_shop -d gamer_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gamer-shop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data: